name: Tennis Sync (ATP/WTA)

on:
  workflow_dispatch:
  schedule:
    # Monday 01:00 UTC — Tennis Abstract refreshes weekly-ish
    - cron: '0 1 * * 1'

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests supabase

      - name: Fetch ATP/WTA (Indian players + rankings)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/fetch_tennis.py
