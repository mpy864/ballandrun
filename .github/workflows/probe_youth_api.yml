name: Probe Youth Rankings API

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install requests
      - name: Probe GetRankingIndividuals for youth categories
        run: |
          python3 - <<'EOF'
          import requests, json, time
          from datetime import date, timedelta

          API = 'https://wttcmsapigateway-new.azure-api.net/ttu/Rankings/GetRankingIndividuals'
          HEADERS = {
              'apikey':     '2bf8b222-532c-4c60-8ebe-eb6fdfebe84a',
              'secapimkey': 'S_WTT_882jjh7basdj91834783mds8j2jsd81',
              'origin':     'https://www.worldtabletennis.com',
              'referer':    'https://www.worldtabletennis.com/',
              'accept':     'application/json',
          }

          # Youth rankings publish on MONDAY — use most recent Monday's ISO week
          today = date.today()
          days_back = today.weekday()          # 0=Mon, so Mon→0 days back
          monday = today - timedelta(days=days_back)
          iso = monday.isocalendar()
          YEAR, WEEK = iso.year, iso.week
          print(f'Most recent Monday: {monday}  Year={YEAR}  Week={WEEK}')

          # Also compute the Tuesday-based week (what old probe used) for comparison
          tue_back = (today.weekday() - 1) % 7
          tuesday = today - timedelta(days=tue_back)
          tue_iso = tuesday.isocalendar()
          print(f'Most recent Tuesday: {tuesday}  Year={tue_iso.year}  Week={tue_iso.week}')
          print(f'Week delta: {WEEK - tue_iso.week} (non-zero = probe was using wrong week)\n')

          def probe(label, params):
              try:
                  r = requests.get(API, params={**params, 'StartRank': 1, 'EndRank': 5, 'q': 1},
                                   headers=HEADERS, timeout=30)
                  body = r.json()
                  result = body.get('Result', body if isinstance(body, list) else [])
                  status = f'HTTP {r.status_code}'
                  if result:
                      print(f'[OK]   {label} -> {len(result)} records')
                      print('       First record:', json.dumps(result[0], ensure_ascii=False))
                  else:
                      print(f'[EMPTY] {label} -> {status} body={json.dumps(body)[:120]}')
              except Exception as e:
                  print(f'[ERR]  {label} -> {e}')
              time.sleep(1)

          CDN      = 'https://wtt-web-frontdoor-withoutcache-cqakg0andqf5hchn.a01.azurefd.net/ranking'
          CURR_PAIRS = 'https://wttcmsapigateway-new.azure-api.net/internalttu/RankingsCurrentWeek/CurrentWeek/GetRankingPairs'
          HIST_PAIRS = 'https://wttcmsapigateway-new.azure-api.net/ttu/Rankings/GetRankingPairs'

          def probe_url(label, url, params):
              try:
                  r = requests.get(url, params={**params, 'q': 1}, headers=HEADERS, timeout=30)
                  body = r.json()
                  result = body.get('Result', body if isinstance(body, list) else [])
                  if result:
                      print(f'[OK]   {label} -> {len(result)} records')
                      print('       First:', json.dumps(result[0], ensure_ascii=False)[:200])
                  else:
                      print(f'[EMPTY] {label} -> HTTP {r.status_code} body={json.dumps(body)[:150]}')
              except Exception as e:
                  print(f'[ERR]  {label} -> {e}')
              time.sleep(0.8)

          # ── Test 0: PUBLISH_DATE.json for YOU — what weeks are available? ──
          print('=== Test 0: PUBLISH_DATE.json — available youth weeks ===')
          r = requests.get(f'{CDN}/PUBLISH_DATE.json', params={'CategoryCode': 'YOU', 'q': 1},
                           headers=HEADERS, timeout=30)
          print(f'HTTP {r.status_code}')
          if r.status_code == 200:
              data = r.json()
              rows = data.get('Result', data if isinstance(data, list) else [])
              print(f'Total published weeks: {len(rows)}')
              for row in rows[:10]:
                  print(f'  {row}')
              if len(rows) > 10:
                  print(f'  ... and {len(rows)-10} more')
          print()

          # ── Test 1: YOU singles current week ───────────────────────────────
          print('=== Test 1: YOU singles — current week (GetRankingIndividuals) ===')
          for sub in ['MS', 'WS']:
              probe(f'YOU/{sub}', {'CategoryCode': 'YOU', 'SubEventCode': sub,
                                   'RankingYear': YEAR, 'RankingWeek': WEEK})

          # ── Test 2: YOU doubles current week via CurrentWeek/GetRankingPairs
          print('\n=== Test 2: YOU doubles — current week (CurrentWeek/GetRankingPairs) ===')
          for sub in ['MD', 'WD', 'XD']:
              probe_url(f'YOU/{sub}', CURR_PAIRS,
                        {'CategoryCode': 'YOU', 'SubEventCode': sub,
                         'StartRank': 1, 'EndRank': 5})
          for age in ['U17', 'U19']:
              for sub in ['MD', 'WD', 'XD']:
                  probe_url(f'YOU/{age}/{sub}', CURR_PAIRS,
                            {'CategoryCode': 'YOU', 'AgeCategoryCode': age,
                             'SubEventCode': sub, 'StartRank': 1, 'EndRank': 5})

          # ── Test 3: YOU doubles historical via ttu/Rankings/GetRankingPairs ─
          print('\n=== Test 3: YOU doubles — historical (ttu/Rankings/GetRankingPairs) ===')
          for weeks_back in [1, 2, 4, 8]:
              past = monday - timedelta(weeks=weeks_back)
              iso  = past.isocalendar()
              for sub in ['MD', 'WD']:
                  probe_url(f'YOU/{sub} @{past} W={iso.week}', HIST_PAIRS,
                            {'CategoryCode': 'YOU', 'SubEventCode': sub,
                             'RankingYear': iso.year, 'RankingWeek': iso.week,
                             'StartRank': 1, 'EndRank': 5})

          # ── Test 4: YOU singles historical — step back week by week ────────
          print('\n=== Test 4: YOU singles — historical (1–8 weeks back) ===')
          for weeks_back in [1, 2, 4, 8]:
              past = monday - timedelta(weeks=weeks_back)
              iso  = past.isocalendar()
              probe(f'YOU/MS @{past} W={iso.week}',
                    {'CategoryCode': 'YOU', 'SubEventCode': 'MS',
                     'RankingYear': iso.year, 'RankingWeek': iso.week})

          # ── Test 5: 2025 history depth ─────────────────────────────────────
          print('\n=== Test 5: 2025 history depth ===')
          for yr, wk in [(2025, 52), (2025, 26), (2025, 1), (2024, 26)]:
              probe(f'YOU/MS Y={yr} W={wk}',
                    {'CategoryCode': 'YOU', 'SubEventCode': 'MS',
                     'RankingYear': yr, 'RankingWeek': wk})

          print('\nDone.')
          EOF
