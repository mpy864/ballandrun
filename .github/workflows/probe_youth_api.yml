name: Probe Youth Rankings API

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install requests
      - name: Probe youth API endpoints
        run: |
          python3 - <<'EOF'
          import requests, time

          HEADERS = {
              'apikey':     '2bf8b222-532c-4c60-8ebe-eb6fdfebe84a',
              'secapimkey': 'S_WTT_882jjh7basdj91834783mds8j2jsd81',
              'origin':     'https://www.worldtabletennis.com',
              'referer':    'https://www.worldtabletennis.com/',
              'accept':     'application/json',
          }
          BASE = 'https://wttcmsapigateway-new.azure-api.net/ttu'

          # Try different endpoints on same gateway
          endpoints = [
              '/Rankings/GetYouthRankingIndividuals',
              '/Rankings/GetRankingYouth',
              '/Rankings/GetYouthRanking',
              '/Rankings/GetJuniorRanking',
              '/Rankings/GetRankingIndividualsYouth',
              '/Youth/Rankings/GetRankingIndividuals',
              '/Rankings/GetRankingIndividuals',  # with AgeGroup param
          ]

          for ep in endpoints:
              url = BASE + ep
              # Try with AgeCategoryCode param
              for age in ['U17', 'U19']:
                  params = {
                      'CategoryCode': 'YTH',
                      'SubEventCode': 'MS',
                      'AgeCategoryCode': age,
                      'RankingYear': 2026,
                      'RankingWeek': 17,
                      'StartRank': 1,
                      'EndRank': 3,
                      'q': 1,
                  }
                  try:
                      resp = requests.get(url, params=params, headers=HEADERS, timeout=10)
                      results = (resp.json().get('Result') or []) if resp.status_code == 200 else []
                      name = results[0].get('PlayerName', '') if results else ''
                      status = f'✅ {len(results)} results  {name}' if results else f'❌ {resp.status_code}'
                  except Exception as e:
                      status = f'💥 {e}'
                  print(f'{ep}/{age}: {status}')
                  time.sleep(0.5)

          # Also try the ITTF gateway (different base URL)
          print('\n--- ITTF gateway ---')
          ittf_endpoints = [
              'https://wttcmsapigateway-new.azure-api.net/ittf/Rankings/GetRankingIndividuals',
              'https://wttcmsapigateway-new.azure-api.net/ttu/Rankings/GetRankingIndividuals',
          ]
          for url in ittf_endpoints:
              for age in ['U17', 'U15']:
                  params = {
                      'AgeCategoryCode': age,
                      'SubEventCode': 'MS',
                      'RankingYear': 2026,
                      'RankingWeek': 17,
                      'StartRank': 1, 'EndRank': 3, 'q': 1,
                  }
                  try:
                      resp = requests.get(url, params=params, headers=HEADERS, timeout=10)
                      results = (resp.json().get('Result') or []) if resp.status_code == 200 else []
                      name = results[0].get('PlayerName', '') if results else ''
                      status = f'✅ {len(results)} results  {name}' if results else f'❌ {resp.status_code}'
                  except Exception as e:
                      status = f'💥 {e}'
                  print(f'{url.split("/")[-1]}/{age}: {status}')
                  time.sleep(0.5)
          EOF
