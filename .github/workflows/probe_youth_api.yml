name: Probe Youth Rankings API

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install requests
      - name: Probe GetRankingIndividuals for youth categories
        run: |
          python3 - <<'EOF'
          import requests, json, time
          from datetime import date, timedelta

          API = 'https://wttcmsapigateway-new.azure-api.net/ttu/Rankings/GetRankingIndividuals'
          HEADERS = {
              'apikey':     '2bf8b222-532c-4c60-8ebe-eb6fdfebe84a',
              'secapimkey': 'S_WTT_882jjh7basdj91834783mds8j2jsd81',
              'origin':     'https://www.worldtabletennis.com',
              'referer':    'https://www.worldtabletennis.com/',
              'accept':     'application/json',
          }

          # Youth rankings publish on MONDAY — use most recent Monday's ISO week
          today = date.today()
          days_back = today.weekday()          # 0=Mon, so Mon→0 days back
          monday = today - timedelta(days=days_back)
          iso = monday.isocalendar()
          YEAR, WEEK = iso.year, iso.week
          print(f'Most recent Monday: {monday}  Year={YEAR}  Week={WEEK}')

          # Also compute the Tuesday-based week (what old probe used) for comparison
          tue_back = (today.weekday() - 1) % 7
          tuesday = today - timedelta(days=tue_back)
          tue_iso = tuesday.isocalendar()
          print(f'Most recent Tuesday: {tuesday}  Year={tue_iso.year}  Week={tue_iso.week}')
          print(f'Week delta: {WEEK - tue_iso.week} (non-zero = probe was using wrong week)\n')

          def probe(label, params):
              try:
                  r = requests.get(API, params={**params, 'StartRank': 1, 'EndRank': 5, 'q': 1},
                                   headers=HEADERS, timeout=30)
                  body = r.json()
                  result = body.get('Result', body if isinstance(body, list) else [])
                  status = f'HTTP {r.status_code}'
                  if result:
                      print(f'[OK]   {label} -> {len(result)} records')
                      print('       First record:', json.dumps(result[0], ensure_ascii=False))
                  else:
                      print(f'[EMPTY] {label} -> {status} body={json.dumps(body)[:120]}')
              except Exception as e:
                  print(f'[ERR]  {label} -> {e}')
              time.sleep(1)

          # ── Attempt 0: Sanity check — SEN/MS with Monday week (should return data) ──
          print('=== Test 0: SEN/MS sanity check with Monday week ===')\

          probe('SEN/MS sanity', {'CategoryCode': 'SEN', 'SubEventCode': 'MS',
                                   'RankingYear': YEAR, 'RankingWeek': WEEK})

          # ── Attempt 1: CategoryCode=YOU, no age sub-param ──────────────────
          print('\n=== Test 1: CategoryCode=YOU (no age param) ===')
          for sub in ['MS', 'WS', 'MD', 'WD', 'XD', 'MDI', 'WDI', 'XDI']:
              probe(f'YOU/{sub}', {'CategoryCode': 'YOU', 'SubEventCode': sub,
                                   'RankingYear': YEAR, 'RankingWeek': WEEK})

          # ── Attempt 2: CategoryCode=YOU + AgeCategoryCode param ────────────
          print('\n=== Test 2: CategoryCode=YOU + AgeCategoryCode ===')
          for age in ['U13', 'U15', 'U17', 'U19']:
              for sub in ['MS', 'WS']:
                  probe(f'YOU/{age}/{sub}', {'CategoryCode': 'YOU', 'AgeCategoryCode': age,
                                              'SubEventCode': sub,
                                              'RankingYear': YEAR, 'RankingWeek': WEEK})

          # ── Attempt 3: CategoryCode encodes both (e.g. YOU_U17) ────────────
          print('\n=== Test 3: CategoryCode=YOU_U17 style ===')
          for age in ['U13', 'U15', 'U17', 'U19']:
              for sub in ['MS', 'WS']:
                  probe(f'YOU_{age}/{sub}', {'CategoryCode': f'YOU_{age}',
                                              'SubEventCode': sub,
                                              'RankingYear': YEAR, 'RankingWeek': WEEK})

          # ── Attempt 4: Historical week — 4 weeks ago ───────────────────────
          print('\n=== Test 4: Historical date (4 weeks ago) — YOU/MS ===')
          old = tuesday - timedelta(weeks=4)
          old_iso = old.isocalendar()
          for sub in ['MS', 'WS']:
              probe(f'YOU/{sub} @{old}', {'CategoryCode': 'YOU', 'SubEventCode': sub,
                                           'RankingYear': old_iso.year, 'RankingWeek': old_iso.week})

          # ── Attempt 5: Historical with AgeCategoryCode ────────────────────
          print('\n=== Test 5: Historical (4 weeks ago) + AgeCategoryCode ===')
          for age in ['U17', 'U19']:
              probe(f'YOU/{age}/MS @{old}', {'CategoryCode': 'YOU', 'AgeCategoryCode': age,
                                               'SubEventCode': 'MS',
                                               'RankingYear': old_iso.year, 'RankingWeek': old_iso.week})

          print('\nDone.')
          EOF
