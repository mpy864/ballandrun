name: Probe Youth Rankings API

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install requests
      - name: Probe youth API parameters
        run: |
          python3 - <<'EOF'
          import requests, time, json

          URL = "https://wttcmsapigateway-new.azure-api.net/ttu/Rankings/GetRankingIndividuals"
          HEADERS = {
              'apikey':     '2bf8b222-532c-4c60-8ebe-eb6fdfebe84a',
              'secapimkey': 'S_WTT_882jjh7basdj91834783mds8j2jsd81',
              'origin':     'https://www.worldtabletennis.com',
              'referer':    'https://www.worldtabletennis.com/',
              'accept':     'application/json',
          }

          # From URL analysis:
          # U19 → no AgeCategoryCode (just Age=YOUTH) → likely CategoryCode=JUN
          # U17/U15/U13/U11 → AgeCategoryCode=U17 etc
          # Tabs → MS, WS, MD, WD, XD

          combos = [
              # U19 guesses
              ('JUN',  'MS', None),
              ('JUN',  'WS', None),
              ('JUN',  'MD', None),
              ('JUN',  'WD', None),
              ('JUN',  'XD', None),
              # U17 with AgeCategoryCode
              ('YTH',  'MS', 'U17'),
              ('YTH',  'WS', 'U17'),
              ('YTH',  'MD', 'U17'),
              ('YTH',  'WD', 'U17'),
              ('YTH',  'XD', 'U17'),
              ('JUN',  'MS', 'U17'),
              ('JUN',  'WS', 'U17'),
              ('CAD',  'MS', 'U17'),
              ('CAD',  'WS', 'U17'),
              # U15
              ('YTH',  'MS', 'U15'),
              ('YTH',  'WS', 'U15'),
              ('CAD',  'MS', 'U15'),
              ('CAD',  'WS', 'U15'),
          ]

          for cat, sub, age in combos:
              params = {
                  'CategoryCode': cat,
                  'SubEventCode': sub,
                  'RankingYear':  2026,
                  'RankingWeek':  17,
                  'StartRank':    1,
                  'EndRank':      3,
                  'q':            1,
              }
              if age:
                  params['AgeCategoryCode'] = age

              resp = requests.get(URL, params=params, headers=HEADERS, timeout=20)
              results = resp.json().get('Result') or []
              age_str = age or 'U19?'
              name = results[0].get('PlayerName', '') if results else ''
              status = f'✅ {len(results)} results  {name}' if results else '❌ EMPTY'
              print(f'{cat:6}/{sub}/{age_str:4}: {status}')
              time.sleep(1.2)
          EOF
