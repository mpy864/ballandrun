name: Supabase API check

# Tells whether the Supabase REST API (used by the dashboard and every fetcher)
# answers. 200 = working. 402 = project still restricted by Supabase.
# Last manual check: 2026-11-26

on:
  workflow_dispatch:
  push:
    branches: [csv-export]
    paths: ['.github/workflows/api_check.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Read one row through the API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          code=$(curl -s -o body.txt -w "%{http_code}" "$SUPABASE_URL/rest/v1/wtt_events?select=event_id&limit=1" \
                 -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "HTTP $code"
          head -c 400 body.txt; echo
          [ "$code" = "200" ]
