name: Backfill Youth Rankings

on:
  workflow_dispatch:
    inputs:
      from_year:
        description: 'Start year (e.g. 2024)'
        required: false
        default: '2024'
      from_week:
        description: 'Start week (e.g. 1)'
        required: false
        default: '1'

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests supabase

      - name: Run backfill
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python scripts/backfill_youth_rankings.py \
            --from-year ${{ github.event.inputs.from_year }} \
            --from-week ${{ github.event.inputs.from_week }}
