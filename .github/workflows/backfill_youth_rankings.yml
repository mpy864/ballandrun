name: Backfill Youth Rankings

# Historical youth rankings, run by hand. Uses the SAME script as the daily sync
# (scripts/fetch_youth_rankings.py) so a backfill can never write a different shape
# from the live ingest — the three older backfill scripts did exactly that and are
# now in scripts/_retired/.
#
# Give an explicit week range and run in chunks. A week costs roughly 2-3 minutes,
# so keep a chunk to about 20 weeks to stay inside the timeout below.

on:
  workflow_dispatch:
    inputs:
      from_year:
        description: 'Start year (e.g. 2025)'
        required: true
      from_week:
        description: 'Start ISO week (1-53)'
        required: true
      to_year:
        description: 'End year — leave blank to run to the latest published week'
        required: false
      to_week:
        description: 'End ISO week — leave blank to run to the latest published week'
        required: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests supabase

      - name: Backfill youth rankings
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FROM_YEAR: ${{ inputs.from_year }}
          FROM_WEEK: ${{ inputs.from_week }}
          TO_YEAR:   ${{ inputs.to_year }}
          TO_WEEK:   ${{ inputs.to_week }}
        run: |
          ARGS="--from-year $FROM_YEAR --from-week $FROM_WEEK"
          if [ -n "$TO_YEAR" ] && [ -n "$TO_WEEK" ]; then
            ARGS="$ARGS --to-year $TO_YEAR --to-week $TO_WEEK"
          fi
          echo "Running: fetch_youth_rankings.py $ARGS"
          python scripts/fetch_youth_rankings.py $ARGS
