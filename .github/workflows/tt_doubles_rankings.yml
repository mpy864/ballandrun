name: TT Senior Doubles Rankings

on:
  workflow_dispatch:
  schedule:
    # Daily, not weekly. WTT publishes on Mondays, but this ran at 02:00 UTC on the
    # Monday itself — before that day's list was up — so it always collected the
    # PREVIOUS week and the feed sat permanently ~7 days behind. Worse, a transient
    # failure (a DNS blip took it out on 2026-07-27) then cost a full week, because
    # the next attempt was seven days away.
    #
    # backfill_senior_doubles.py checks week_exists() and fetches only what is
    # missing, so a daily run costs one CDN call and a few existence checks when
    # there is nothing new. Timing sensitivity disappears and a failure self-corrects
    # the next morning.
    - cron: '0 2 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests supabase brotli

      - name: Fetch senior doubles rankings (MD/WD/XD)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/backfill_senior_doubles.py --from-year 2026
